; M5Template — project template for the M5StickS3 (ESP32-S3-PICO-1-N8R8)

[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The StickS3 carries 8 MB of flash and 8 MB of octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_8MB.csv

; The framework appends its own -std=gnu++11 after build_flags, and the last
; one wins: without the unflag the board builds as C++11 while the host tests
; build as C++17. Its -Os makes per-pixel and DSP code about twice as slow as
; -O2.
build_unflags =
    -std=gnu++11
    -Os
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -O2

; 0.2.23 fixed M5.Power.powerOff() waking the StickS3 right back up
lib_deps = m5stack/M5Unified@^0.2.23

; `pio run -e sticks3 -t merged` builds a single image for M5Burner
extra_scripts = post:tools/merged_image.py

; Native USB shows up as /dev/cu.usbmodem*; without this PlatformIO may pick
; /dev/cu.Bluetooth-Incoming-Port when the board is not connected yet
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200

; Everything in lib/ is hardware-independent and is tested on the host
[env:native]
platform = native
test_framework = unity
; Without UNITY_INCLUDE_DOUBLE the TEST_ASSERT_*_DOUBLE macros do not work
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
